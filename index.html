<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>15 Funciones</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1 class="page">15 Funciones</h1>

    <section>
        <h2>Suma</h2>
        <div class="campo"><label>Número 1</label><input type="number" id="suma-a"></div>
        <div class="campo"><label>Número 2</label><input type="number" id="suma-b"></div>
        <button onclick="calcularSuma()">Sumar</button>
        <div id="resultado-1" class="resultado"></div>
    </section>

    <section>
        <h2>Restar Dos Números</h2>
        <div class="campo"><label>Número 1</label><input type="number" id="restar-a"></div>
        <div class="campo"><label>Número 2</label><input type="number" id="restar-b"></div>
        <button onclick="calcularRestar()">Restar</button>
        <div id="resultado-2" class="resultado"></div>
    </section>

    <section>
        <h2>Multiplicación</h2>
        <div class="campo"><label>Número 1</label><input type="number" id="multiplicacion-a"></div>
        <div class="campo"><label>Número 2</label><input type="number" id="multiplicacion-b"></div>
        <button onclick="calcularMultiplicacion()">Multiplicar</button>
        <div id="resultado-3" class="resultado"></div>
    </section>

    <section>
        <h2>División</h2>
        <div class="campo"><label>Dividendo</label><input type="number" id="division-a"></div>
        <div class="campo"><label>Divisor</label><input type="number" id="division-b"></div>
        <button onclick="calcularDivision()">Dividir</button>
        <div id="resultado-4" class="resultado"></div>
    </section>

    <section>
        <h2>Potencia</h2>
        <div class="campo"><label>Base</label><input type="number" id="potencia-a"></div>
        <div class="campo"><label>Exponente</label><input type="number" id="potencia-b"></div>
        <button onclick="calcularPotencia()">Calcular</button>
        <div id="resultado-5" class="resultado"></div>
    </section>

    <section>
        <h2>¿Cuál es mayor?</h2>
        <div class="campo"><label>Número 1</label><input type="number" id="mayor-a"></div>
        <div class="campo"><label>Número 2</label><input type="number" id="mayor-b"></div>
        <button onclick="calcularMayor()">Comparar</button>
        <div id="resultado-6" class="resultado"></div>
    </section>

    <section>
        <h2>El Más Pequeño</h2>
        <div class="campo"><label>Números (separados por coma)</label><input type="text" id="menor-a"></div>
        <button onclick="calcularMenor()">Buscar</button>
        <div id="resultado-7" class="resultado"></div>
    </section>

    <section>
        <h2>¿Positivo o Negativo?</h2>
        <div class="campo"><label>Número</label><input type="number" id="positivo-a"></div>
        <button onclick="calcularPositivo()">Verificar</button>
        <div id="resultado-8" class="resultado"></div>
    </section>

    <section>
        <h2>¿Par o Impar?</h2>
        <div class="campo"><label>Número</label><input type="number" id="parimpar-a"></div>
        <button onclick="calcularParImpar()">Verificar</button>
        <div id="resultado-9" class="resultado"></div>
    </section>

    <section>
        <h2>Solo Impares</h2>
        <div class="campo"><label>Números (separados por coma)</label><input type="text" id="impares-a"></div>
        <button onclick="calcularImpares()">Buscar</button>
        <div id="resultado-10" class="resultado"></div>
    </section>

    <section>
        <h2>Filtrar Negativos</h2>
        <div class="campo"><label>Números (separados por coma)</label><input type="text" id="negativos-a"></div>
        <button onclick="calcularNegativos()">Filtrar</button>
        <div id="resultado-11" class="resultado"></div>
    </section>

    <section>
        <h2>Mitad de Cada Número</h2>
        <div class="campo"><label>Números (separados por coma)</label><input type="text" id="mitad-a"></div>
        <button onclick="calcularMitadBtn()">Calcular</button>
        <div id="resultado-12" class="resultado"></div>
    </section>

    <section>
        <h2>Calcular Descuento</h2>
        <div class="campo"><label>Precio</label><input type="number" id="descuento-a"></div>
        <div class="campo"><label>Descuento (%)</label><input type="number" id="descuento-b"></div>
        <button onclick="calcularDescuentoBtn()">Calcular</button>
        <div id="resultado-13" class="resultado"></div>
    </section>

    <section>
        <h2>Área del Cuadrado</h2>
        <div class="campo"><label>Lado</label><input type="number" id="areacuadrado-a"></div>
        <button onclick="calcularAreaCuadrado()">Calcular</button>
        <div id="resultado-14" class="resultado"></div>
    </section>

    <section>
        <h2>Área del Rectángulo</h2>
        <div class="campo"><label>Base</label><input type="number" id="arearectangulo-a"></div>
        <div class="campo"><label>Altura</label><input type="number" id="arearectangulo-b"></div>
        <button onclick="calcularAreaRectangulo()">Calcular</button>
        <div id="resultado-15" class="resultado"></div>
    </section>

    <script src="js/suma.js"></script>
    <script src="js/restar.js"></script>
    <script src="js/multiplicacion.js"></script>
    <script src="js/division.js"></script>
    <script src="js/potencia.js"></script>
    <script src="js/mayor.js"></script>
    <script src="js/menor.js"></script>
    <script src="js/positivo.js"></script>
    <script src="js/parimpar.js"></script>
    <script src="js/impares.js"></script>
    <script src="js/negativos.js"></script>
    <script src="js/mitad.js"></script>
    <script src="js/descuento.js"></script>
    <script src="js/areacuadrado.js"></script>
    <script src="js/arearectangulo.js"></script>

    <script>
        function num(id) {
            var v = parseFloat(document.getElementById(id).value);
            return isNaN(v) ? 0 : v;
        }

        function lista(id) {
            var partes = document.getElementById(id).value.split(",");
            var nums = [];
            for (var i = 0; i < partes.length; i++) {
                var v = parseFloat(partes[i].trim());
                if (!isNaN(v)) nums.push(v);
            }
            return nums;
        }

        function mostrar(id, texto) {
            document.getElementById(id).innerText = texto;
            console.log(id + " =", texto);
        }

        function calcularSuma() {
            mostrar('resultado-1', sumar(num('suma-a'), num('suma-b')));
        }

        function calcularRestar() {
            mostrar('resultado-2', restar(num('restar-a'), num('restar-b')));
        }

        function calcularMultiplicacion() {
            mostrar('resultado-3', multiplicar(num('multiplicacion-a'), num('multiplicacion-b')));
        }

        function calcularDivision() {
            mostrar('resultado-4', dividir(num('division-a'), num('division-b')));
        }

        function calcularPotencia() {
            mostrar('resultado-5', potencia(num('potencia-a'), num('potencia-b')));
        }

        function calcularMayor() {
            mostrar('resultado-6', obtenerMayor(num('mayor-a'), num('mayor-b')));
        }

        function calcularMenor() {
            mostrar('resultado-7', encontrarMenor(lista('menor-a')));
        }

        function calcularPositivo() {
            mostrar('resultado-8', verificarSigno(num('positivo-a')));
        }

        function calcularParImpar() {
            mostrar('resultado-9', verificarParImpar(num('parimpar-a')));
        }

        function calcularImpares() {
            mostrar('resultado-10', buscarImpares(lista('impares-a')));
        }

        function calcularNegativos() {
            mostrar('resultado-11', filtrarNegativos(lista('negativos-a')));
        }

        function calcularMitadBtn() {
            mostrar('resultado-12', calcularMitad(lista('mitad-a')));
        }

        function calcularDescuentoBtn() {
            mostrar('resultado-13', calcularDescuento(num('descuento-a'), num('descuento-b')));
        }

        function calcularAreaCuadrado() {
            mostrar('resultado-14', areaCuadrado(num('areacuadrado-a')));
        }

        function calcularAreaRectangulo() {
            mostrar('resultado-15', areaRectangulo(num('arearectangulo-a'), num('arearectangulo-b')));
        }

        function calcularTodo() {
            calcularSuma();
            calcularRestar();
            calcularMultiplicacion();
            calcularDivision();
            calcularPotencia();
            calcularMayor();
            calcularMenor();
            calcularPositivo();
            calcularParImpar();
            calcularImpares();
            calcularNegativos();
            calcularMitadBtn();
            calcularDescuentoBtn();
            calcularAreaCuadrado();
            calcularAreaRectangulo();
        }
    </script>
</body>
</html>
